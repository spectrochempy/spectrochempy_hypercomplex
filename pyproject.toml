[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "spectrochempy-hypercomplex"
version = "0.2.0"
description = "Hypercomplex / quaternion support plugin for SpectroChemPy"
requires-python = ">=3.11"
readme = "README.md"
license-files = ["LICENSE"]
classifiers = [
]
dependencies = [
    "spectrochempy>=1.1.0,<2",
    "numpy",
    "numpy-quaternion>=2024.0.7",
]

[project.entry-points."spectrochempy.plugins"]
hypercomplex = "spectrochempy_hypercomplex:HyperComplexPlugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.spectrochempy]
official-plugin = true
